services:
  - type: web
    name: parishweb-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: DATABASE_URL
        scope: secret
      - key: ADMIN_TOKEN
        scope: secret
      - key: RESEND_API_KEY
        scope: secret
      - key: FRONTEND_URL
        scope: secret
